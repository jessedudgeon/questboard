name: Deploy QuestBoard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Set only after verifying both reviewed additive migrations in production.
    if: ${{ vars.QB_SCHEMA_VERSION == '20261027145136' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate application
        run: |
          npm run check
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static QuestBoard application
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
